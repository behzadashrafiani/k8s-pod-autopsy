apiVersion: v1
kind: Pod
metadata: { name: puller-1, namespace: demo }
spec:
  containers:
    - name: web
      image: registry.example.com/web:doesnotexist
status:
  phase: Pending
  containerStatuses:
    - name: web
      restartCount: 0
      state:
        waiting:
          reason: ImagePullBackOff
          message: 'Back-off pulling image "registry.example.com/web:doesnotexist"'
