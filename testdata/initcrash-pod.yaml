apiVersion: v1
kind: Pod
metadata: { name: migrated-1, namespace: demo }
spec:
  initContainers:
    - name: migrate
      image: migrate:1
  containers:
    - name: web
      image: web:1
status:
  phase: Pending
  initContainerStatuses:
    - name: migrate
      restartCount: 4
      lastState:
        terminated: { exitCode: 1, reason: Error, message: "migration failed: connection refused" }
      state: { waiting: { reason: CrashLoopBackOff } }
  containerStatuses:
    - name: web
      restartCount: 0
      state: { waiting: { reason: PodInitializing } }
